[project]
name = "ops-triage-agent"
version = "0.1.0"
description = "Enterprise agentic IT/Ops support-triage system: multi-agent tool use, an MCP server with enterprise controls, RAG, and an eval-gated release pipeline."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Andrew Kaiserauer" }]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "numpy>=1.26",
    "httpx>=0.27",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
# Real model providers — optional; the system runs fully offline without them.
openai = ["openai>=1.40"]
anthropic = ["anthropic>=0.34"]
mcp = ["mcp>=1.2"]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[project.scripts]
triage = "triage.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/triage"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# Depends(...) in argument defaults is the idiomatic FastAPI dependency pattern.
"src/triage/api/server.py" = ["B008"]
