name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Primary target is 3.14; 3.11 is the supported floor, tested to prove the range.
        python-version: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: uv pip install --system -e ".[dev,mcp]"

      - name: Lint (ruff)
        run: ruff check src evals tests mcp_server

      - name: Seed data + build RAG index
        run: |
          python -m triage.data.seed
          python -m triage.rag.ingest

      - name: Tests
        run: pytest

      - name: Eval gate (fails on quality/safety regression)
        run: python evals/run_evals.py --gate

      - name: Restore previous eval report
        id: prev_report
        continue-on-error: true  # supplementary signal; never block the merge on infra hiccups
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/prev-eval-report
          RUN_ID=$(gh run list --repo "${{ github.repository }}" --workflow=ci.yml \
            --branch=main --status=success --limit 1 --json databaseId --jq '.[0].databaseId' || true)
          if [ -z "$RUN_ID" ]; then
            echo "No prior successful CI run on main; nothing to compare against yet."
            exit 0
          fi
          if gh run download "$RUN_ID" --repo "${{ github.repository }}" \
              --name "eval-report-${{ matrix.python-version }}" --dir /tmp/prev-eval-report; then
            echo "restored=true" >> "$GITHUB_OUTPUT"
          else
            echo "Run $RUN_ID has no eval-report-${{ matrix.python-version }} artifact; skipping."
          fi

      - name: Drift check against previous main report
        if: steps.prev_report.outputs.restored == 'true'
        run: python evals/drift.py /tmp/prev-eval-report/*.json evals/reports/*.json

      - name: Upload eval report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-report-${{ matrix.python-version }}
          path: evals/reports/*.json
          if-no-files-found: ignore

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build front-end
        working-directory: web
        run: |
          npm install
          npm run build
