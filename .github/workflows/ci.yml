name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  backend:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Primary target is 3.14; 3.11 is the supported floor, tested to prove the range.
        python-version: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@e58605a9b6da7c637471fab8847a5e5a6b8df081 # v5

      - name: Install dependencies
        run: uv sync --frozen --extra dev --extra mcp

      - name: Lint (ruff)
        run: uv run ruff check src evals tests mcp_server

      - name: Seed data + build RAG index
        run: |
          uv run python -m triage.data.seed
          uv run python -m triage.rag.ingest

      - name: Tests
        run: uv run pytest -W error::ResourceWarning

      - name: Eval gate (fails on quality/safety regression)
        run: uv run python evals/run_evals.py --gate

      - name: Restore previous eval report
        id: prev_report
        continue-on-error: true  # supplementary signal; never block the merge on infra hiccups
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/prev-eval-report
          RUN_ID=$(gh run list --repo "${{ github.repository }}" --workflow=ci.yml \
            --branch=main --status=success --limit 1 --json databaseId --jq '.[0].databaseId' || true)
          if [ -z "$RUN_ID" ]; then
            echo "No prior successful CI run on main; nothing to compare against yet."
            exit 0
          fi
          if gh run download "$RUN_ID" --repo "${{ github.repository }}" \
              --name "eval-report-${{ matrix.python-version }}" --dir /tmp/prev-eval-report; then
            echo "restored=true" >> "$GITHUB_OUTPUT"
          else
            echo "Run $RUN_ID has no eval-report-${{ matrix.python-version }} artifact; skipping."
          fi

      - name: Drift check against previous main report
        if: steps.prev_report.outputs.restored == 'true'
        run: uv run python evals/drift.py /tmp/prev-eval-report/*.json evals/reports/*.json

      - name: Upload eval report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: eval-report-${{ matrix.python-version }}
          path: evals/reports/*.json
          if-no-files-found: ignore

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
      - name: Build front-end
        working-directory: web
        run: |
          npm ci
          npm run build

  # Opt-in — never runs on push/PR, only when manually dispatched. Exercises
  # the real OpenAI adapter against a live model, which the hermetic `backend`
  # job above deliberately never does (see tests/test_live_smoke.py).
  live-smoke:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.14"

      - name: Install uv
        uses: astral-sh/setup-uv@e58605a9b6da7c637471fab8847a5e5a6b8df081 # v5

      - name: Install dependencies
        run: uv sync --frozen --extra dev --extra openai

      - name: Live-model smoke test
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: uv run pytest tests/test_live_smoke.py -v
