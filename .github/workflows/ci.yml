name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Primary target is 3.14; 3.11 is the supported floor, tested to prove the range.
        python-version: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: uv pip install --system -e ".[dev,mcp]"

      - name: Lint (ruff)
        run: ruff check src evals tests mcp_server

      - name: Seed data + build RAG index
        run: |
          python -m triage.data.seed
          python -m triage.rag.ingest

      - name: Tests
        run: pytest

      - name: Eval gate (fails on quality/safety regression)
        run: python evals/run_evals.py --gate

      - name: Upload eval report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-report
          path: evals/reports/*.json
          if-no-files-found: ignore

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build front-end
        working-directory: web
        run: |
          npm install
          npm run build
